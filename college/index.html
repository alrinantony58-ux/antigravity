    // =========================================================================
    // MAIN REACT APPLICATION COMPONENT
    // =========================================================================
    function CampusFindApp() {
      // 1. Core State with LocalStorage Persistence
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('campusfind_auth_user');
          return saved ? JSON.parse(saved) : PRESET_USERS.student;
        } catch {
          return PRESET_USERS.student;
        }
      });

      const [lostItems, setLostItems] = useState(() => {
        try {
          const saved = localStorage.getItem('campusfind_lost_items');
          return saved ? JSON.parse(saved) : INITIAL_LOST_ITEMS;
        } catch {
          return INITIAL_LOST_ITEMS;
        }
      });

      const [foundItems, setFoundItems] = useState(() => {
        try {
          const saved = localStorage.getItem('campusfind_found_items');
          return saved ? JSON.parse(saved) : INITIAL_FOUND_ITEMS;
        } catch {
          return INITIAL_FOUND_ITEMS;
        }
      });

      const [claims, setClaims] = useState(() => {
        try {
          const saved = localStorage.getItem('campusfind_claims');
          return saved ? JSON.parse(saved) : INITIAL_CLAIMS;
        } catch {
          return INITIAL_CLAIMS;
        }
      });

      const [handovers, setHandovers] = useState(() => {
        try {
          const saved = localStorage.getItem('campusfind_handovers');
          return saved ? JSON.parse(saved) : INITIAL_HANDOVERS;
        } catch {
          return INITIAL_HANDOVERS;
        }
      });

      const [activityLogs, setActivityLogs] = useState(() => {
        try {
          const saved = localStorage.getItem('campusfind_logs');
          return saved ? JSON.parse(saved) : INITIAL_LOGS;
        } catch {
          return INITIAL_LOGS;
        }
      });

      const [notifications, setNotifications] = useState(() => {
        try {
          const saved = localStorage.getItem('campusfind_notifications');
          return saved ? JSON.parse(saved) : INITIAL_NOTIFICATIONS;
        } catch {
          return INITIAL_NOTIFICATIONS;
        }
      });

      // 2. Navigation & Views
      // Views: 'HOME', 'BROWSE', 'REPORT_LOST', 'REPORT_FOUND', 'HOW_IT_WORKS', 'USER_DASHBOARD', 'ADMIN_DASHBOARD'
      const [currentView, setCurrentView] = useState('HOME');
      const [browseTab, setBrowseTab] = useState('ALL'); // 'ALL', 'LOST', 'FOUND', 'REUNITED'
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCategory, setFilterCategory] = useState('All Categories');
      const [filterBuilding, setFilterBuilding] = useState('All Campus Locations');
      const [filterDateRange, setFilterDateRange] = useState('ALL'); // 'ALL', 'TODAY', 'WEEK', 'MONTH'
      const [sortBy, setSortBy] = useState('NEWEST');

      // 3. Modals & Drawers
      const [selectedItemDetail, setSelectedItemDetail] = useState(null); // When inspecting an item
      const [claimTargetItem, setClaimTargetItem] = useState(null); // When opening claim verification
      const [flyerTargetItem, setFlyerTargetItem] = useState(null); // When generating printable notice
      const [activeMatchModal, setActiveMatchModal] = useState(false);
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [isNotificationDrawerOpen, setIsNotificationDrawerOpen] = useState(false);
      const [selectedClaimDetail, setSelectedClaimDetail] = useState(null); // For Admin claim review
      const [handoverModalClaim, setHandoverModalClaim] = useState(null); // For Admin physical handover

      // 4. Toast Notifications System
      const [toasts, setToasts] = useState([]);
      const addToast = (message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4500);
      };

      // Sync state to LocalStorage
      useEffect(() => {
        try {
          localStorage.setItem('campusfind_auth_user', JSON.stringify(currentUser));
          localStorage.setItem('campusfind_lost_items', JSON.stringify(lostItems));
          localStorage.setItem('campusfind_found_items', JSON.stringify(foundItems));
          localStorage.setItem('campusfind_claims', JSON.stringify(claims));
          localStorage.setItem('campusfind_handovers', JSON.stringify(handovers));
          localStorage.setItem('campusfind_logs', JSON.stringify(activityLogs));
          localStorage.setItem('campusfind_notifications', JSON.stringify(notifications));
        } catch (e) {
          console.error('LocalStorage sync error:', e);
        }
      }, [currentUser, lostItems, foundItems, claims, handovers, activityLogs, notifications]);

      // Calculate Statistics
      const stats = useMemo(() => {
        const totalLost = lostItems.length;
        const totalFound = foundItems.length;
        const totalReported = totalLost + totalFound;
        const totalReturned = handovers.length + foundItems.filter(f => f.status === 'reunited').length;
        const pendingClaims = claims.filter(c => c.status === 'pending' || c.status === 'under_review').length;
        const approvedClaims = claims.filter(c => c.status === 'approved' || c.status === 'returned').length;
        const rejectedClaims = claims.filter(c => c.status === 'rejected').length;
        const recoveryRate = totalReported > 0 ? Math.round((totalReturned / totalReported) * 100) : 0;

        return {
          totalReported,
          totalLost,
          totalFound,
          totalReturned,
          pendingClaims,
          approvedClaims,
          rejectedClaims,
          recoveryRate
        };
      }, [lostItems, foundItems, handovers, claims]);

      // Smart Matching Algorithm: Computes correlation between open Lost items and Found items
      const smartMatches = useMemo(() => {
        const matches = [];
        const openLost = lostItems.filter(l => l.status === 'open');
        const availableFound = foundItems.filter(f => f.status === 'available' || f.status === 'claim_pending');

        openLost.forEach(lost => {
          availableFound.forEach(found => {
            let score = 0;
            const reasons = [];

            // 1. Category match (+35%)
            if (lost.category === found.category) {
              score += 35;
              reasons.push('Same item category');
            }

            // 2. Location proximity match (+25%)
            if (lost.building === found.building) {
              score += 25;
              reasons.push('Found in identical campus building');
            }

            // 3. Keyword token matching in titles & descriptions (+30%)
            const cleanWords = str => (str || '').toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(w => w.length > 3);
            const lostTokens = [...cleanWords(lost.itemName), ...cleanWords(lost.brand)];
            const foundTokens = [...cleanWords(found.itemName), ...cleanWords(found.brand), ...cleanWords(found.generalDescription)];
            const commonTokens = lostTokens.filter(t => foundTokens.includes(t));

            if (commonTokens.length > 0) {
              score += Math.min(30, commonTokens.length * 15);
              reasons.push(`Matching keywords: ${[...new Set(commonTokens)].join(', ')}`);
            }

            // 4. Date closeness (+10%)
            if (lost.dateLastSeen && found.dateFound) {
              const diffDays = Math.abs(new Date(found.dateFound) - new Date(lost.dateLastSeen)) / (1000 * 60 * 60 * 24);
              if (diffDays <= 2) {
                score += 10;
                reasons.push('Reported within 48 hours of loss');
              }
            }

            if (score >= 50) {
              matches.push({
                lost,
                found,
                confidence: Math.min(96, score),
                reasons
              });
            }
          });
        });

        return matches.sort((a, b) => b.confidence - a.confidence);
      }, [lostItems, foundItems]);

      // Filtered & Sorted Items for Browse Page
      const allCatalogItems = useMemo(() => {
        const list = [
          ...lostItems.map(item => ({ ...item, recordType: 'LOST' })),
          ...foundItems.map(item => ({ ...item, recordType: 'FOUND' }))
        ];

        return list.filter(item => {
          // Tab filter
          if (browseTab === 'LOST' && item.recordType !== 'LOST') return false;
          if (browseTab === 'FOUND' && item.recordType !== 'FOUND') return false;
          if (browseTab === 'REUNITED' && item.status !== 'reunited' && item.status !== 'returned') return false;

          // Category filter
          if (filterCategory !== 'All Categories' && item.category !== filterCategory) return false;

          // Building filter
          if (filterBuilding !== 'All Campus Locations' && item.building !== filterBuilding) return false;

          // Search query
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const text = `${item.itemName} ${item.category} ${item.brand || ''} ${item.building} ${item.description || item.generalDescription || ''} ${item.reportCode}`.toLowerCase();
            if (!text.includes(q)) return false;
          }

          return true;
        }).sort((a, b) => {
          if (sortBy === 'NEWEST') return new Date(b.createdAt) - new Date(a.createdAt);
          if (sortBy === 'OLDEST') return new Date(a.createdAt) - new Date(b.createdAt);
          return 0;
        });
      }, [lostItems, foundItems, browseTab, filterCategory, filterBuilding, searchQuery, sortBy]);

      // Unread notification count
      const unreadCount = useMemo(() => {
        return notifications.filter(n => n.userId === currentUser.id && !n.isRead).length;
      }, [notifications, currentUser]);

      // -----------------------------------------------------------------------
      // USER & SYSTEM ACTIONS
      // -----------------------------------------------------------------------

      // Switch simulated role (Student <-> Admin)
      const handleSwitchRole = (targetRole) => {
        const newUser = targetRole === 'admin' ? PRESET_USERS.admin : PRESET_USERS.student;
        setCurrentUser(newUser);
        addToast(`Switched active profile to ${newUser.role.toUpperCase()}: ${newUser.fullName}`, 'info');
      };

      // Submit Report: Lost Item
      const handleSubmitLostReport = (formData) => {
        const code = `LOST-2026-${Math.floor(1000 + Math.random() * 9000)}`;
        const newItem = {
          id: 'lost-' + Date.now(),
          reportCode: code,
          userId: currentUser.id,
          reporterName: currentUser.fullName,
          reporterEmail: currentUser.email,
          reporterPhone: formData.phone || currentUser.phoneNumber,
          reporterDept: currentUser.department,
          itemName: formData.itemName,
          category: formData.category,
          brand: formData.brand || '',
          primaryColor: formData.color,
          description: formData.description,
          imageUrl: formData.imageUrl || 'https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?auto=format&fit=crop&w=700&q=80',
          lastKnownLocation: formData.lastKnownLocation,
          building: formData.building,
          specificArea: formData.specificArea,
          dateLastSeen: formData.dateLastSeen,
          timeLastSeen: formData.timeLastSeen,
          dateNoticedMissing: formData.dateNoticedMissing,
          timeNoticedMissing: formData.timeNoticedMissing,
          uniqueIdentifyingMarks: formData.uniqueIdentifyingMarks, // Confidential
          rewardAmount: formData.rewardAmount || '',
          status: 'open',
          createdAt: new Date().toISOString()
        };

        setLostItems(prev => [newItem, ...prev]);
        setCurrentView('USER_DASHBOARD');
        addToast(`Lost Report #${code} submitted successfully! Saved to campus database.`, 'success');

        // Check if smart match triggers
        setTimeout(() => {
          addToast("Smart Match algorithm is scanning registered campus found items...", "info");
        }, 800);
      };

      // Submit Report: Found Item
      const handleSubmitFoundReport = (formData) => {
        const code = `FND-2026-${Math.floor(1000 + Math.random() * 9000)}`;
        const newItem = {
          id: 'fnd-' + Date.now(),
          reportCode: code,
          finderId: currentUser.id,
          finderName: currentUser.fullName,
          finderEmail: currentUser.email,
          itemName: formData.itemName,
          category: formData.category,
          brand: formData.brand || '',
          primaryColor: formData.color || '',
          generalDescription: formData.generalDescription,
          imageUrl: formData.imageUrl || 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=700&q=80',
          foundLocation: formData.foundLocation,
          building: formData.building,
          specificArea: formData.specificArea || '',
          dateFound: formData.dateFound,
          timeFound: formData.timeFound,
          possessionStatus: formData.possessionStatus,
          custodyLocationDetails: formData.custodyLocationDetails || 'With Finder',
          custodyOfficerName: formData.custodyOfficerName || '',
          status: 'available',
          createdAt: new Date().toISOString()
        };

        setFoundItems(prev => [newItem, ...prev]);
        setCurrentView('USER_DASHBOARD');
        addToast(`Found Item #${code} successfully registered! Thank you for being a Good Samaritan.`, 'success');
      };

      // Submit Ownership Claim (The 8 Mandatory Questions)
      const handleSubmitClaim = (claimAnswers) => {
        if (!claimTargetItem) return;

        const claimCode = `CLM-2026-${Math.floor(1000 + Math.random() * 9000)}`;
        const newClaim = {
          id: 'clm-' + Date.now(),
          claimCode,
          foundItemId: claimTargetItem.id,
          foundItemCode: claimTargetItem.reportCode,
          foundItemName: claimTargetItem.itemName,
          claimantId: currentUser.id,
          claimantName: currentUser.fullName,
          claimantEmail: currentUser.email,
          claimantStudentId: currentUser.studentId,
          claimantPhone: currentUser.phoneNumber,
          q1_unique_characteristics: claimAnswers.q1,
          q2_distinguishing_features: claimAnswers.q2,
          q3_last_had_location: claimAnswers.q3,
          q4_date_lost: claimAnswers.q4,
          q5_approx_time_lost: claimAnswers.q5,
          q6_identifying_marks_or_accessories: claimAnswers.q6,
          q7_purchase_receipt_or_document_info: claimAnswers.q7,
          q8_additional_evidence: claimAnswers.q8,
          evidenceAttachmentUrl: claimAnswers.evidenceUrl || '',
          status: 'pending',
          adminReviewNotes: '',
          reviewedBy: null,
          reviewedAt: null,
          proofRequestMessage: '',
          createdAt: new Date().toISOString()
        };

        setClaims(prev => [newClaim, ...prev]);

        // Update found item status
        setFoundItems(prev => prev.map(f => {
          if (f.id === claimTargetItem.id) {
            return { ...f, status: 'claim_pending' };
          }
          return f;
        }));

        // Log Activity
        setActivityLogs(prev => [
          {
            id: 'log-' + Date.now(),
            adminName: 'System / Automated Intake',
            actionType: 'CLAIM_SUBMITTED',
            targetId: claimCode,
            details: `Student ${currentUser.fullName} filed ownership claim for #${claimTargetItem.reportCode}.`,
            createdAt: new Date().toISOString()
          },
          ...prev
        ]);

        setClaimTargetItem(null);
        setCurrentView('USER_DASHBOARD');
        addToast(`Ownership Verification Claim #${claimCode} submitted! Stored in private administrative custody.`, 'success');
      };

      // Admin Action: Review Claim Decision
      const handleAdminClaimDecision = (claimId, decision, notes = '', proofMessage = '') => {
        setClaims(prev => prev.map(c => {
          if (c.id === claimId) {
            return {
              ...c,
              status: decision,
              adminReviewNotes: notes || c.adminReviewNotes,
              proofRequestMessage: proofMessage || c.proofRequestMessage,
              reviewedBy: currentUser.id,
              reviewedAt: new Date().toISOString()
            };
          }
          return c;
        }));

        const targetClaim = claims.find(c => c.id === claimId);

        // Notify Claimant
        if (targetClaim) {
          const newNotif = {
            id: 'notif-' + Date.now(),
            userId: targetClaim.claimantId,
            title: `Claim ${decision === 'approved' ? 'Approved!' : decision === 'rejected' ? 'Decision: Rejected' : 'Additional Proof Requested'}`,
            message: decision === 'approved' 
              ? `Your claim ${targetClaim.claimCode} has been approved by Campus Security! Please visit the custody desk for physical handover.`
              : decision === 'additional_proof_required'
              ? `Campus Security requested additional proof: "${proofMessage}". Please upload details in your dashboard.`
              : `Your claim ${targetClaim.claimCode} was reviewed and rejected. Admin notes: ${notes}`,
            type: 'claim_status_change',
            referenceId: targetClaim.claimCode,
            isRead: false,
            createdAt: new Date().toISOString()
          };
          setNotifications(prev => [newNotif, ...prev]);
        }

        // Add to Admin Audit Log
        setActivityLogs(prev => [
          {
            id: 'log-' + Date.now(),
            adminName: currentUser.fullName,
            actionType: `CLAIM_${decision.toUpperCase()}`,
            targetId: targetClaim?.claimCode || claimId,
            details: `Decision: ${decision}. Admin review remarks: ${notes || proofMessage || 'None'}`,
            createdAt: new Date().toISOString()
          },
          ...prev
        ]);

        setSelectedClaimDetail(null);
        addToast(`Claim decision logged: ${decision.replace(/_/g, ' ').toUpperCase()}`, 'success');
      };

      // Admin Action: Confirm Physical Handover
      const handleConfirmHandover = (handoverData) => {
        const newHandover = {
          id: 'hnd-' + Date.now(),
          claimId: handoverData.claimId,
          foundItemId: handoverData.foundItemId,
          itemCode: handoverData.itemCode,
          itemName: handoverData.itemName,
          claimantName: handoverData.claimantName,
          recipientStudentId: handoverData.recipientStudentId,
          authorizedAdminName: currentUser.fullName,
          handoverDate: new Date().toISOString(),
          handoverLocation: handoverData.location,
          notes: handoverData.notes
        };

        setHandovers(prev => [newHandover, ...prev]);

                  <h4 className="text-lg font-bold text-white">{currentUser.fullName}</h4>
                  <span className="px-3 py-0.5 rounded-full text-[10px] font-bold uppercase bg-purple-500/20 text-accent-purpleLight border border-purple-500/40 inline-block mt-1">
                    {currentUser.role}
                  </span>
                  <p className="text-xs text-slate-400 mt-2">{currentUser.email}</p>
                  <p className="text-xs text-slate-500">{currentUser.department}</p>
                </div>

                {/* Instant Role Switching Presets for Demo Evaluation */}
                <div className="bg-[#141419] p-4 rounded-2xl border border-purple-950/60 mt-4 space-y-2">
                  <span className="text-[11px] font-bold text-slate-400 block mb-1 uppercase tracking-wider">
                    Fast Demo Role Presets:
                  </span>
                  <button
                    onClick={() => {
                      handleSwitchRole('student');
                      setIsAuthModalOpen(false);
                    }}
                    className="w-full py-2.5 px-3 rounded-xl text-xs font-semibold text-left flex items-center justify-between bg-white/5 hover:bg-white/10 text-white transition-colors"
                  >
                    <div>
                      <strong className="block">Alex Rivera (Student)</strong>
                      <span className="text-[10px] text-slate-400">Reports lost items, claims belongings</span>
                    </div>
                    {currentUser.role === 'student' && <Icon name="check" className="w-4 h-4 text-accent-purple" />}
                  </button>

                  <button
                    onClick={() => {
                      handleSwitchRole('admin');
                      setIsAuthModalOpen(false);
                    }}
                    className="w-full py-2.5 px-3 rounded-xl text-xs font-semibold text-left flex items-center justify-between bg-white/5 hover:bg-white/10 text-white transition-colors"
                  >
                    <div>
                      <strong className="block">Chief Marcus Miller (Admin)</strong>
                      <span className="text-[10px] text-slate-400">Audits claims, conducts handovers</span>
                    </div>
                    {currentUser.role === 'admin' && <Icon name="check" className="w-4 h-4 text-accent-purple" />}
                  </button>
                </div>

                <div className="mt-6 pt-3 border-t border-purple-950/40 flex justify-end">
                  <button
                    onClick={() => setIsAuthModalOpen(false)}
                    className="px-5 py-2 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/20 text-white"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MAIN FOOTER */}
          {/* ================================================================= */}
          <footer className="bg-[#080808] border-t border-purple-950/40 py-12 px-4 sm:px-6 lg:px-8 text-xs text-slate-500 mt-auto">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center text-white font-bold">
                  <Icon name="shield" className="w-5 h-5" />
                </div>
                <div>
                  <span className="font-extrabold text-white text-sm tracking-tight">Campus<span className="text-accent-purple">Find</span></span>
                  <p className="text-[11px] text-slate-400">"Lost Today. Found Tomorrow."</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center justify-center gap-6 text-slate-400 font-medium text-xs">
                <button onClick={() => setCurrentView('HOME')} className="hover:text-white transition-colors">Home</button>
                <button onClick={() => { setBrowseTab('ALL'); setCurrentView('BROWSE'); }} className="hover:text-white transition-colors">Browse Items</button>
                <button onClick={() => setCurrentView('REPORT_LOST')} className="hover:text-rose-400 transition-colors">Report Lost</button>
                <button onClick={() => setCurrentView('REPORT_FOUND')} className="hover:text-emerald-400 transition-colors">Report Found</button>
                <button onClick={() => setCurrentView('HOW_IT_WORKS')} className="hover:text-white transition-colors">How It Works</button>
                <button onClick={handleResetDemoData} className="hover:text-rose-400 transition-colors">Reset Demo Data</button>
              </div>

              <div className="text-center md:text-right text-[11px]">
                <p>&copy; 2026 University Lost & Found Operations. All rights reserved.</p>
                <p className="text-slate-500 mt-0.5">Emergency Police Desk: Ext. 1000 &bull; Central Security Vault Gate 1</p>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Mount Application
    ReactDOM.createRoot(document.getElementById('root')).render(<CampusFindApp />);
  </script>
</body>
</html>
