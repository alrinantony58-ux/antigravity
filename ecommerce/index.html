                          <div className="flex items-center justify-between p-2 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-semibold">
                            <span>Coupon &apos;{appliedPromo}&apos; active (-{discountPercent * 100}%)</span>
                            <button onClick={removePromo} className="text-xs text-rose-600 hover:underline font-bold">
                              Remove
                            </button>
                          </div>
                        )}
                        {promoError && (
                          <p className="text-[11px] text-rose-600 mt-1 font-medium">{promoError}</p>
                        )}
                        {!appliedPromo && (
                          <div className="flex items-center gap-2 mt-1.5 text-[10px] text-slate-500">
                            <span>Try:</span>
                            <button
                              onClick={() => setPromoInput('ROYAL20')}
                              className="text-blue-700 font-bold hover:underline"
                            >
                              ROYAL20 (-20%)
                            </button>
                          </div>
                        )}
                      </div>

                      {/* Calculations */}
                      <div className="space-y-1.5 text-xs text-slate-600 pt-1">
                        <div className="flex justify-between">
                          <span>Subtotal</span>
                          <span className="font-semibold text-slate-900 font-mono">${subtotal}</span>
                        </div>
                        {discount > 0 && (
                          <div className="flex justify-between text-emerald-700 font-semibold">
                            <span>Royal Discount</span>
                            <span className="font-mono">-${discount}</span>
                          </div>
                        )}
                        <div className="flex justify-between">
                          <span>Express Courier</span>
                          <span className="font-semibold text-slate-900 font-mono">
                            {shipping === 0 ? <span className="text-emerald-700 uppercase font-bold text-[11px]">Free</span> : `$${shipping}`}
                          </span>
                        </div>
                        <div className="flex justify-between text-base font-extrabold text-slate-900 pt-2 border-t border-slate-200">
                          <span>Estimated Total</span>
                          <span className="font-mono text-blue-700 text-lg">${finalTotal}</span>
                        </div>
                      </div>

                      {/* Checkout Button */}
                      <button
                        onClick={() => {
                          setIsCartOpen(false);
                          setIsCheckoutOpen(true);
                        }}
                        className="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-blue-700 to-blue-600 hover:from-blue-800 hover:to-blue-700 text-white font-bold text-sm tracking-wide uppercase shadow-royal-md transition-all cursor-pointer"
                      >
                        Proceed to Royal Checkout →
                      </button>

                      <div className="flex items-center justify-center gap-3 text-[10px] text-slate-400 font-medium">
                        <span>🔒 256-Bit SSL Encrypted</span>
                        <span>•</span>
                        <span>30-Day Royal Guarantee</span>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

          {/* QUICK VIEW MODAL */}
          {quickViewProduct && (
            <div className="fixed inset-0 z-50 overflow-y-auto">
              <div className="flex min-h-full items-center justify-center p-4 text-center">
                <div
                  className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm"
                  onClick={() => setQuickViewProduct(null)}
                />
                <div className="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl sm:my-8 sm:w-full sm:max-w-3xl border border-slate-200 z-10">
                  <button
                    onClick={() => setQuickViewProduct(null)}
                    className="absolute right-4 top-4 z-20 rounded-full bg-slate-100 p-2 text-slate-500 hover:text-slate-900"
                  >
                    ✕
                  </button>
                  <div className="grid grid-cols-1 md:grid-cols-2">
                    <div className="h-72 md:h-full bg-slate-100 overflow-hidden">
                      <img
                        src={quickViewProduct.image}
                        alt={quickViewProduct.name}
                        className="w-full h-full object-cover"
                      />
                    </div>
                    <div className="p-6 md:p-8 space-y-4">
                      <div>
                        <span className="text-xs font-bold uppercase tracking-widest text-blue-700">
                          {quickViewProduct.category}
                        </span>
                        <h2 className="text-xl font-extrabold text-slate-900 mt-1">
                          {quickViewProduct.name}
                        </h2>
                        <div className="flex items-baseline gap-2 mt-2">
                          <span className="text-2xl font-black text-slate-900 font-mono">
                            ${quickViewProduct.price}
                          </span>
                          {quickViewProduct.originalPrice && (
                            <span className="text-xs text-slate-400 line-through font-mono">
                              ${quickViewProduct.originalPrice}
                            </span>
                          )}
                        </div>
                      </div>

                      <p className="text-xs text-slate-600 leading-relaxed">
                        {quickViewProduct.description}
                      </p>

                      {quickViewProduct.specs && (
                        <div className="pt-2 border-t border-slate-100 text-xs space-y-1">
                          {Object.entries(quickViewProduct.specs).map(([k, v]) => (
                            <div key={k} className="flex justify-between py-0.5">
                              <span className="text-slate-500">{k}:</span>
                              <span className="font-semibold text-slate-800">{v}</span>
                            </div>
                          ))}
                        </div>
                      )}

                      <button
                        onClick={() => {
                          addItem(quickViewProduct, 1);
                          setQuickViewProduct(null);
                        }}
                        className="w-full py-3 rounded-xl bg-blue-700 hover:bg-blue-800 text-white font-bold text-xs uppercase tracking-wider shadow-royal-sm transition-all cursor-pointer"
                      >
                        Add to Shopping Bag
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* CHECKOUT MODAL */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 z-50 overflow-y-auto">
              <div className="flex min-h-full items-center justify-center p-4 text-center">
                <div
                  className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm"
                  onClick={() => {
                    setIsCheckoutOpen(false);
                    setOrderConfirmed(false);
                  }}
                />
                <div className="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl sm:my-8 sm:w-full sm:max-w-xl border border-slate-200 z-10 p-6 sm:p-8">
                  <button
                    onClick={() => {
                      setIsCheckoutOpen(false);
                      setOrderConfirmed(false);
                    }}
                    className="absolute right-4 top-4 rounded-full bg-slate-100 p-2 text-slate-500 hover:text-slate-900"
                  >
                    ✕
                  </button>

                  {orderConfirmed ? (
                    <div className="text-center py-6 space-y-5">
                      <div className="w-16 h-16 bg-blue-50 text-blue-700 rounded-2xl flex items-center justify-center mx-auto text-3xl border border-blue-200">
                        ✓
                      </div>
                      <h3 className="text-2xl font-extrabold text-slate-900">
                        Thank You for Your Order
                      </h3>
                      <p className="text-xs text-slate-600 max-w-sm mx-auto">
                        Your transaction has completed under order reference{' '}
                        <span className="font-mono font-bold text-blue-700">{orderId}</span>.
                      </p>
                      <button
                        onClick={() => {
                          setIsCheckoutOpen(false);
                          setOrderConfirmed(false);
                        }}
                        className="px-6 py-3 rounded-full bg-blue-700 text-white font-bold text-xs uppercase tracking-wider cursor-pointer"
                      >
                        Return to Boutique
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleOrderSubmit} className="space-y-4">
                      <div className="border-b border-slate-200 pb-3">
                        <span className="text-[11px] font-bold uppercase tracking-wider text-blue-700">
                          🔒 Sovereign Express Checkout
                        </span>
                        <h3 className="text-xl font-extrabold text-slate-900">
                          Order Dispatch Details
                        </h3>
                      </div>

                      <div className="bg-blue-50/60 p-3 rounded-xl border border-blue-100 flex justify-between items-center text-xs">
                        <span className="font-semibold text-slate-800">Total Due ({totalItems} items):</span>
                        <span className="text-lg font-black text-blue-800 font-mono">${finalTotal}</span>
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Full Name</label>
                        <input
                          type="text"
                          required
                          value={checkoutForm.name}
                          onChange={(e) => setCheckoutForm({ ...checkoutForm, name: e.target.value })}
                          className="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Delivery Address</label>
                        <input
                          type="text"
                          required
                          value={checkoutForm.address}
                          onChange={(e) => setCheckoutForm({ ...checkoutForm, address: e.target.value })}
                          className="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-[11px] font-semibold text-slate-600 mb-1">City</label>
                          <input
                            type="text"
                            required
                            value={checkoutForm.city}
                            onChange={(e) => setCheckoutForm({ ...checkoutForm, city: e.target.value })}
                            className="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold text-slate-600 mb-1">Postal Code</label>
                          <input
                            type="text"
                            required
                            value={checkoutForm.postalCode}
                            onChange={(e) => setCheckoutForm({ ...checkoutForm, postalCode: e.target.value })}
                            className="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none font-mono"
                          />
                        </div>
                      </div>

                      <div className="p-3 border border-blue-200 rounded-xl bg-blue-50/20 space-y-2">
                        <label className="block text-[11px] font-semibold text-slate-600">Simulated Card</label>
                        <input
                          type="text"
                          required
                          value={checkoutForm.cardNumber}
                          onChange={(e) => setCheckoutForm({ ...checkoutForm, cardNumber: e.target.value })}
                          className="w-full px-3 py-2 text-xs border border-slate-200 rounded-lg font-mono bg-white"
                        />
                      </div>

                      <button
                        type="submit"
                        disabled={isProcessingOrder}
                        className="w-full py-3.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white font-bold text-xs uppercase tracking-wider shadow-royal-md transition-all cursor-pointer disabled:opacity-75"
                      >
                        {isProcessingOrder ? 'Authorizing Royal Transaction...' : `Confirm Order ($${finalTotal})`}
                      </button>
                    </form>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50">
              <div className="flex items-center gap-2.5 px-4 py-3 rounded-2xl bg-slate-900 text-white shadow-2xl border border-blue-500/40">
                <span className="text-blue-400">✓</span>
                <span className="text-xs font-semibold">{toastMessage}</span>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-950 text-white border-t border-blue-900/50 pt-16 pb-12 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-12">
                <div className="col-span-2 space-y-3">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-lg bg-blue-700 flex items-center justify-center font-bold text-white">
                      R
                    </div>
                    <span className="font-extrabold text-lg tracking-tight">ROYAL COBALT</span>
                  </div>
                  <p className="text-xs text-slate-400 max-w-sm leading-relaxed">
                    Dedicated to the art of timeless design, royal blue aesthetics, and masterwork engineering across horology, audio, and modern accessories.
                  </p>
                </div>
                <div>
                  <h4 className="text-xs font-bold uppercase tracking-wider text-white mb-3">Atelier</h4>
                  <ul className="space-y-2 text-xs text-slate-400">
                    <li>Automatic Timepieces</li>
                    <li>Studio Acoustics</li>
                    <li>Titanium Tech</li>
                    <li>Cashmere Apparel</li>
                  </ul>
                </div>
                <div>
                  <h4 className="text-xs font-bold uppercase tracking-wider text-white mb-3">Guarantees</h4>
                  <ul className="space-y-2 text-xs text-slate-400">
                    <li>Complimentary Express Shipping</li>
                    <li>3-Year Atelier Warranty</li>
                    <li>30-Day Courtesy Returns</li>
                    <li>256-Bit Encrypted Checkout</li>
                  </ul>
                </div>
              </div>
              <div className="pt-8 border-t border-slate-900 text-xs text-slate-500 text-center">
                © 2026 ROYAL COBALT MAISON INC. ALL RIGHTS RESERVED.
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
